<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8c735f"><title>NAVO CRM</title>
<style>
:root{--bg:#f8f5f1;--card:#fff;--ink:#302b27;--muted:#93867b;--line:#e9e1d9;--brand:#8c735f;--soft:#f1e9e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding-bottom:90px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:24px;letter-spacing:2px}.muted{color:var(--muted);font-size:12px}.view{display:none;padding:8px 16px}.view.on{display:block}.hero{background:linear-gradient(135deg,#927966,#705946);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px}.hero>b{font-size:32px;display:block;margin:4px 0 15px}.heroGrid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.heroGrid div{background:#ffffff18;padding:10px;border-radius:14px}.heroGrid b{font-size:18px;margin:2px 0;display:block}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button,.card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px}.quick .primary{background:var(--brand);color:#fff}.section{margin-top:19px}.title{display:flex;justify-content:space-between;margin-bottom:9px}.title h2{font-size:17px;margin:0}.stats .card{padding:13px}.radarCard{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px;cursor:pointer}.radarCard:hover{border-color:var(--brand)}.radarCard .hint{font-size:11px;color:var(--muted);margin-top:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.on{display:flex}.modalBox{background:#fff;width:min(760px,100%);max-height:82vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalHead h2{margin:0;font-size:19px}.closeBtn{border:0;background:var(--soft);border-radius:10px;padding:7px 11px}.personRow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.personRow:last-child{border-bottom:0}.value{font-size:20px;font-weight:800;margin-top:4px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;background:#fff;font-size:16px}label{font-size:12px;color:var(--muted);display:block;margin-top:12px}button{font:inherit;cursor:pointer}.submit{width:100%;border:0;background:var(--brand);color:#fff;border-radius:13px;padding:14px;margin-top:14px;font-weight:800}.submit:disabled{opacity:.6}.msg{margin-top:12px;padding:11px 13px;border-radius:12px;background:#f6f1ec;color:#705946;font-size:13px;white-space:pre-wrap;display:none}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.row:last-child{border-bottom:0}.customer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:9px}.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.mini{background:var(--soft);padding:8px;border-radius:10px}.mini small{display:block;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;border-top:1px solid var(--line)}.bottomIn{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.bottom button{border:0;background:none;color:var(--muted);font-size:11px}.bottom button.on{color:var(--brand);font-weight:800}.bottom i{display:block;font-size:20px;font-style:normal}@media(min-width:650px){.app{padding-left:15px;padding-right:15px}}
</style></head><body>
<div class="app">
<header class="top"><div><div class="logo">NAVO</div><div class="muted">CUSTOMER CRM</div></div><button id="logoutBtn" type="button">登出</button></header>
<section id="login" class="view on"><div class="card"><h2>NAVO 登入</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" type="button" class="submit">登入／建立帳號</button><div id="authMsg" class="msg"></div><p class="muted">第一次使用可直接建立 NAVO 帳號；若需要 Email 驗證，畫面會提示。</p></div></section>
<section id="home" class="view"><div class="hero"><span class="muted" style="color:#fff">本月營業額</span><b id="month">$0</b><div class="heroGrid"><div>今年累計<b id="year">$0</b></div><div>累積營業額<b id="alltime">$0</b></div><div>客戶人數<b id="count">0</b></div><div>平均客單<b id="avgOrder">$0</b></div></div></div><div class="quick"><button id="goAdd" class="primary" type="button">＋<strong>新增消費</strong><br><small>快速記一筆</small></button><button id="goCustomers" type="button">👑<strong>我的客戶</strong><br><small>CRM 分析</small></button></div><div class="section"><div class="title"><h2>💡 客戶雷達</h2></div><div class="stats" id="radar"></div></div><div class="section"><div class="title"><h2>🏆 客戶排行</h2></div><div class="list" id="topCustomers"></div></div><div class="section"><div class="title"><h2>✈️ 代購場次分析</h2></div><div class="list" id="tripStats"></div></div><div class="section"><div class="title"><h2>🛍️ 商品類別分析</h2></div><div class="list" id="categoryStats"></div></div><div class="section"><div class="title"><h2>🔥 最近消費</h2></div><div class="list" id="recent"></div></div></section>
<section id="add" class="view"><div class="card"><h2 id="addTitle">🛍️ 新增消費</h2><label>客戶 *</label><select id="customer"></select><label>消費日期</label><input id="date" type="date"><label>代購場次</label><select id="trip"></select><label>代購國家（依場次自動帶出）</label><select id="country"><option value="">請先選場次</option><option>日本</option><option>韓國</option><option>泰國</option><option>香港</option><option>其他</option></select><label>消費金額 *</label><input id="amount" type="number" inputmode="decimal" placeholder="$ 0"><label>商品類別</label><select id="category"><option>可愛小物</option><option>美妝／保養</option><option>文創／文具</option><option>零食</option><option>鞋子</option><option>潮牌</option><option>精品／包包</option><option>童裝</option><option>其他</option></select><label>購買商品</label><input id="product"><label>備註</label><textarea id="note"></textarea><button id="savePurchase" class="submit" type="button">✓ 儲存</button><button id="cancelEdit" type="button" style="width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:12px;margin-top:8px;display:none">取消編輯</button><div id="addMsg" class="msg"></div></div></section>
<section id="customers" class="view"><div class="title"><h2>👥 客戶</h2><button id="newCustomerBtn" type="button">＋客戶</button></div><input id="search" placeholder="搜尋客戶"><select id="customerDateFilter"><option value="all">全部客戶</option><option value="month">近 30 天新增</option><option value="monthCalendar">本月新增</option><option value="unknown">新增日期未記錄</option></select><div id="customerFilterSummary" class="muted" style="margin:8px 2px"></div><div id="customersList"></div></section>
<section id="trips" class="view"><div class="title"><h2>✈️ 代購場次</h2><button id="newTripBtn" type="button">＋場次</button></div><div id="tripsList"></div></section>
<section id="records" class="view"><div class="title"><h2>🧾 消費紀錄</h2><button id="csvBtn" type="button">CSV</button></div><input id="recordSearch" placeholder="搜尋"><div class="list" id="recordsList"></div></section>
<section id="profile" class="view"><button id="backCustomers" type="button">‹ 客戶</button><div id="profileContent"></div></section>
</div><div id="radarModal" class="modal" onclick="if(event.target===this)closeRadar()"><div class="modalBox"><div class="modalHead"><h2 id="radarModalTitle">客戶名單</h2><button class="closeBtn" type="button" onclick="closeRadar()">關閉</button></div><div class="msg" id="radarDefinition" style="display:block;margin-top:0"></div><div id="radarPeople"></div></div></div><nav class="bottom"><div class="bottomIn"><button data-v="home" type="button"><i>⌂</i>首頁</button><button data-v="add" type="button"><i>＋</i>新增</button><button data-v="customers" type="button"><i>♙</i>客戶</button><button data-v="records" type="button"><i>▤</i>紀錄</button></div></nav>
<script>
const API='https://tjjevkihaezzfjpfnjon.supabase.co';
const KEY='sb_publishable_oNLvhd6hvq6A31GjR2mBAQ_mcPxOx7g';
let accessToken=localStorage.getItem('navo_access_token')||'';
let uid=localStorage.getItem('nvo_uid')||'';
let customers=[],trips=[],purchases=[],lineMembers=[],selected='',editingPurchaseId='';
const $=id=>document.getElementById(id), money=n=>'$'+Math.round(Number(n)||0).toLocaleString();
function msg(id,text,show=true){const e=$(id);if(!e)return;e.textContent=text;e.style.display=show?'block':'none'}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));const t=$(id);if(t)t.classList.add('on');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.v===id));if(uid)render()}
function headers(json=false){const h={'apikey':KEY,'Authorization':'Bearer '+accessToken};if(json)h['Content-Type']='application/json';return h}
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{...headers(!!options.body),...(options.headers||{})}});let data=null;try{data=await r.json()}catch{}if(!r.ok){const m=data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+r.status);throw new Error(m)}return data}
function decodeJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}}
async function load(){if(!accessToken||!uid)throw new Error('目前尚未登入');customers=await api('/rest/v1/customers?select=*&order=name.asc');try{lineMembers=await api('/rest/v1/navo_line_members?select=customer_id,display_name,real_name,phone,bound_at')}catch(e){console.warn('無法讀取 LINE 會員聯絡資料：',e.message);lineMembers=[]}trips=await api('/rest/v1/trips?select=*&order=start_date.desc.nullslast');purchases=await api('/rest/v1/purchases?select=*,customers(name),trips(name)&order=purchase_date.desc');render()}
async function login(){const e=$('email').value.trim(),p=$('password').value;if(!e||!p)return msg('authMsg','請輸入 Email 與密碼');const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';msg('authMsg','正在連線到 NAVO 雲端資料庫…');try{let r;try{r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})})}catch(signErr){if(!/invalid login credentials|email not confirmed/i.test(signErr.message))throw signErr;try{r=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p})})}catch(signupErr){throw new Error('登入失敗：'+signErr.message+'\n建立帳號也失敗：'+signupErr.message)}if(!r?.access_token){msg('authMsg','帳號已建立，但目前需要 Email 驗證。請到信箱點擊確認信，再回到 NAVO 用同一組帳密登入。');return}}if(!r?.access_token)throw new Error('沒有取得登入憑證，請重新整理後再試');accessToken=r.access_token;uid=decodeJwt(accessToken).sub||'';if(!uid)throw new Error('登入成功但無法取得使用者 ID');localStorage.setItem('nvo_access_token',accessToken);localStorage.setItem('nvo_uid',uid);msg('authMsg','',false);await load();show('home')}catch(e){console.error(e);msg('authMsg','登入失敗：'+e.message)}finally{b.disabled=false;b.textContent='登入／建立帳號'}}
async function logout(){accessToken='';uid='';localStorage.removeItem('nvo_access_token');localStorage.removeItem('nvo_uid');show('login')}
async function newCustomer(){if(!uid)return msg('authMsg','目前尚未登入，請重新整理後登入');const name=prompt('客戶本名');if(!name?.trim())return;try{await api('/rest/v1/customers',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:uid,name:name.trim()})});await load();show('customers')}catch(e){alert('新增客戶失敗：'+e.message)}}
async function editCustomer(id){
 const c=customers.find(x=>String(x.id)===String(id));if(!c)return;
 const lm=lineMembers.find(x=>String(x.customer_id)===String(c.id))||{};
 const name=prompt('客戶本名',c.name||'');if(name===null)return;if(!name.trim())return alert('本名不可空白');
 const phone=prompt('電話',lm.phone||'');if(phone===null)return;
 const lineName=prompt('LINE 名稱',lm.display_name||'');if(lineName===null)return;
 const address=prompt('地址',c.address||'');if(address===null)return;
 try{
  await api('/rest/v1/customers?id=eq.'+encodeURIComponent(c.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name:name.trim(),address:address.trim()||null})});
  if(lm.customer_id){await api('/rest/v1/navo_line_members?customer_id=eq.'+encodeURIComponent(c.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({real_name:name.trim(),phone:phone.trim()||null,display_name:lineName.trim()||null})})}
  else if(phone.trim()||lineName.trim()){alert('本名與地址已更新，但此客戶尚未綁定 LINE 會員，因此電話／LINE 名稱未儲存。')}
  await load();show('customers');
 }catch(e){alert('更新客戶資料失敗：'+e.message+'\n若錯誤提到 address，請先執行附上的 SQL。')}
}
async function newTrip(){if(!uid)return alert('目前尚未登入');const name=prompt('代購場次，例如：2026/11 首爾');if(!name?.trim())return;const country=prompt('代購國家：日本／韓國／泰國／香港／其他','日本');if(!['日本','韓國','泰國','香港','其他'].includes(country))return alert('請輸入：日本、韓國、泰國、香港或其他');try{await api('/rest/v1/trips',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:uid,name:`${({日本:'🇯🇵',韓國:'🇰🇷',泰國:'🇹🇭',香港:'🇭🇰',其他:'🌏'}[country])} ${country}｜${name.trim()}`})});await load();show('trips')}catch(e){alert('新增場次失敗：'+e.message)}}
async function savePurchase(){
  const customer_id=$('customer').value,trip_id=$('trip').value,amount=Number($('amount').value),date=$('date').value||new Date().toISOString().slice(0,10);
  if(!customer_id||!amount)return msg('addMsg','請選客戶並輸入金額');
  const body={user_id:uid,customer_id,trip_id:trip_id||null,amount,purchase_date:date,category:$('category').value,product:$('product').value,note:$('note').value};
  try{
    if(editingPurchaseId){
      await api('/rest/v1/purchases?id=eq.'+encodeURIComponent(editingPurchaseId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});
      editingPurchaseId='';$('addTitle').textContent='🛍️ 新增消費';$('savePurchase').textContent='✓ 儲存';$('cancelEdit').style.display='none';
      msg('addMsg','✓ 已更新這筆消費');await load();show('records');
    }else{
      await api('/rest/v1/purchases',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});
      $('amount').value='';$('product').value='';$('note').value='';$('date').value=new Date().toISOString().slice(0,10);$('trip').value='';$('country').value='';
      msg('addMsg','✓ 已儲存');await load();show('home');
    }
  }catch(e){msg('addMsg',(editingPurchaseId?'更新失敗：':'儲存失敗：')+e.message)}
}
function startNewPurchase(){
  editingPurchaseId='';$('addTitle').textContent='🛍️ 新增消費';$('savePurchase').textContent='✓ 儲存';$('cancelEdit').style.display='none';
  if($('date'))$('date').value=new Date().toISOString().slice(0,10);if($('amount'))$('amount').value='';if($('product'))$('product').value='';if($('note'))$('note').value='';if($('trip'))$('trip').value='';if($('country'))$('country').value='';if($('addMsg'))msg('addMsg','',false);show('add');
}
function openEditPurchase(id){
  const p=purchases.find(x=>x.id===id);if(!p)return;
  editingPurchaseId=id;$('addTitle').textContent='✏️ 編輯消費紀錄';$('savePurchase').textContent='✓ 儲存修改';$('cancelEdit').style.display='block';
  $('customer').value=p.customer_id||'';$('date').value=p.purchase_date||new Date().toISOString().slice(0,10);$('trip').value=p.trip_id||'';$('country').value=tripCountry(p.trips)||'';$('amount').value=p.amount||'';$('category').value=p.category||'其他';$('product').value=p.product||'';$('note').value=p.note||'';msg('addMsg','',false);show('add');
}
function cancelEdit(){editingPurchaseId='';$('addTitle').textContent='🛍️ 新增消費';$('savePurchase').textContent='✓ 儲存';$('cancelEdit').style.display='none';show('records')}


function tripCountry(t){const n=t?.name||'';for(const c of ['日本','韓國','泰國','香港'])if(n.includes(c))return c;if(n.includes('其他'))return '其他';return ''}
function countryOf(p){return tripCountry(p.trips)||''}
function countryStatsFor(p){const m={};p.forEach(x=>{const c=countryOf(x);m[c]=(m[c]||0)+Number(x.amount||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function preferredCountry(p){const rows=countryStatsFor(p).filter(x=>x[0]!=='未設定');return rows[0]?.[0]||'尚無資料'}

function summary(c){const p=purchases.filter(x=>x.customer_id===c.id),total=p.reduce((s,x)=>s+Number(x.amount||0),0),last=p.map(x=>x.purchase_date).sort().pop();return{p,total,count:p.length,last}}
function level(n){return n>=100000?'💎 鑽石 VIP':n>=50000?'👑 白金 VIP':n>=20000?'⭐ 金卡':n>=5000?'✨ 熟客':'新客'}
function radarPeople(type){return customers.map(c=>({c,x:summary(c)})).filter(a=>{const x=a.x;if(type==='vip')return x.total>=20000;if(type==='sleep')return x.last&&(Date.now()-new Date(x.last))/86400000>=90;if(type==='new')return x.count===1;if(type==='high')return x.total>=50000;return false}).sort((a,b)=>b.x.total-a.x.total)}
function openRadar(type){const cfg={vip:['👑 VIP 客戶','VIP 定義：累積消費金額 ≥ $20,000。\nVIP 內部分級：⭐ 金卡 $20,000–49,999；👑 白金 VIP $50,000–99,999；💎 鑽石 VIP ≥ $100,000。'],sleep:['😴 90天未消費','定義：最後一筆消費距今天數 ≥ 90 天。'],new:['✨ 新客','定義：目前只有 1 筆消費紀錄。'],high:['💎 高價值客戶','定義：累積消費金額 ≥ $50,000。']}[type];const rows=radarPeople(type);$('radarModalTitle').textContent=`${cfg[0]} · ${rows.length} 人`;$('radarDefinition').textContent=cfg[1];$('radarPeople').innerHTML=rows.map(a=>`<div class="personRow"><div><b>${a.c.name}</b><div class="muted">${level(a.x.total)} · ${a.x.count} 次${a.x.last?' · 最近 '+a.x.last:''}</div></div><b>${money(a.x.total)}</b></div>`).join('')||'<div class="card" style="margin-top:10px">目前沒有符合條件的客戶</div>';$('radarModal').classList.add('on')}
function closeRadar(){$('radarModal').classList.remove('on')}
function render(){if(!uid)return;home();renderCustomers();renderTrips();renderRecords();fillSelects();if(selected)profile(selected)}
function home(){const now=new Date(),ym=now.toISOString().slice(0,7),yr=now.getFullYear()+'-',mt=purchases.filter(p=>p.purchase_date?.startsWith(ym)).reduce((s,p)=>s+Number(p.amount||0),0),yt=purchases.filter(p=>p.purchase_date?.startsWith(yr)).reduce((s,p)=>s+Number(p.amount||0),0),all=purchases.reduce((s,p)=>s+Number(p.amount||0),0),avg=all/(purchases.length||1);$('month').textContent=money(mt);$('year').textContent=money(yt);$('alltime').textContent=money(all);$('count').textContent=customers.length;$('avgOrder').textContent=money(avg);const vip=customers.filter(c=>summary(c).total>=20000).length,sleep=customers.filter(c=>{const x=summary(c);return x.last&&(Date.now()-new Date(x.last))/86400000>=90}).length;$('radar').innerHTML=`<button class="radarCard" type="button" onclick="openRadar('vip')"><div class="muted">👑 VIP</div><div class="value">${vip} 人</div><div class="hint">累積消費滿 $20,000 · 點擊查看名單</div></button><button class="radarCard" type="button" onclick="openRadar('sleep')"><div class="muted">😴 90天未消費</div><div class="value">${sleep} 人</div><div class="hint">最後消費距今 ≥ 90 天 · 點擊查看</div></button><button class="radarCard" type="button" onclick="openRadar('new')"><div class="muted">✨ 新客</div><div class="value">${customers.filter(c=>summary(c).count===1).length} 人</div><div class="hint">目前只有 1 筆消費 · 點擊查看</div></button><button class="radarCard" type="button" onclick="openRadar('high')"><div class="muted">💎 高價值</div><div class="value">${customers.filter(c=>summary(c).total>=50000).length} 人</div><div class="hint">累積消費滿 $50,000 · 點擊查看</div></button>`;const ranked=customers.map(c=>({c,x:summary(c)})).sort((a,b)=>b.x.total-a.x.total).slice(0,5);$('topCustomers').innerHTML=ranked.map((a,i)=>`<div class="row"><div><b>${i+1}. ${a.c.name}</b><div class="muted">${level(a.x.total)} · ${a.x.count} 次</div></div><b>${money(a.x.total)}</b></div>`).join('')||'<div class="row">尚無資料</div>';const tripsMap={};purchases.forEach(p=>{const n=p.trips?.name||'未指定',cn=countryOf(p);if(!tripsMap[n])tripsMap[n]={total:0,count:0,country:cn};tripsMap[n].total+=Number(p.amount||0);tripsMap[n].count++});const tripRows=Object.entries(tripsMap).sort((a,b)=>b[1].total-a[1].total).slice(0,6);$('tripStats').innerHTML=tripRows.map(([n,v])=>`<div class="row"><div><b>${n}</b><div class="muted">🌏 ${v.country} · ${v.count} 筆 · 平均 ${money(v.total/v.count)}</div></div><b>${money(v.total)}</b></div>`).join('')||'<div class="row">尚無代購場次消費</div>';const cats={};purchases.forEach(p=>{const n=p.category||'其他';cats[n]=(cats[n]||0)+Number(p.amount||0)});const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);$('categoryStats').innerHTML=catRows.map(([n,v])=>`<div class="row"><span>${n}</span><b>${money(v)}</b></div>`).join('')||'<div class="row">尚無資料</div>';const r=purchases.slice(0,6);$('recent').innerHTML=r.map(p=>`<div class="row"><div><b>${p.customers?.name||''}</b><div class="muted">${p.purchase_date} · ${p.trips?.name||''} · 🌏 ${countryOf(p)} · ${p.category||''} · ${p.product||''}</div></div><b>${money(p.amount)}</b></div>`).join('')||'<div class="row">尚無資料</div>'}
function renderCustomers(){const q=($('search').value||'').toLowerCase();const filter=$('customerDateFilter')?.value||'all';const now=new Date();const since30=new Date(now.getTime()-30*24*60*60*1000);const monthStart=new Date(now.getFullYear(),now.getMonth(),1);const filtered=customers.filter(c=>{const lm=lineMembers.find(x=>String(x.customer_id)===String(c.id))||{};if(![c.name,c.address,lm.phone,lm.display_name,lm.real_name].join(' ').toLowerCase().includes(q))return false;const created=c.created_at?new Date(c.created_at):null;if(filter==='month')return !!created&&!Number.isNaN(created.getTime())&&created>=since30&&created<=now;if(filter==='monthCalendar')return !!created&&!Number.isNaN(created.getTime())&&created>=monthStart&&created<=now;if(filter==='unknown')return !created||Number.isNaN(created.getTime());return true;});filtered.sort((a,b)=>{const da=a.created_at?new Date(a.created_at).getTime():0,db=b.created_at?new Date(b.created_at).getTime():0;return db-da||summary(b).total-summary(a).total});if($('customerFilterSummary'))$('customerFilterSummary').textContent=`顯示 ${filtered.length} 位／共 ${customers.length} 位客戶 · 新增日期以建立客戶資料的時間為準`; $('customersList').innerHTML=filtered.map(c=>{const x=summary(c),lm=lineMembers.find(m=>String(m.customer_id)===String(c.id))||{};const created=c.created_at?new Date(c.created_at).toLocaleDateString('zh-TW'):'日期未記錄';const isNew=c.created_at&&new Date(c.created_at)>=since30&&new Date(c.created_at)<=now;return `<div class="customer" data-id="${escapeHtml(c.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><b>${escapeHtml(c.name)}</b> ${isNew?'<span style="font-size:11px;background:#e7f3e8;color:#256b36;border-radius:8px;padding:3px 6px">近30天新客</span>':''}<div class="muted">${level(x.total)} · ❤️ ${escapeHtml(preferredCountry(x.p))}</div><div class="muted">新增：${created}</div><div class="muted">電話：${escapeHtml(lm.phone||'未填寫')} · LINE：${escapeHtml(lm.display_name||'未綁定／未填寫')}</div><div class="muted">地址：${escapeHtml(c.address||'未填寫')}</div></div><div style="text-align:right;flex-shrink:0"><b>${money(x.total)}</b><br><button type="button" onclick="event.stopPropagation();editCustomer('${escapeHtml(c.id)}')" style="margin-top:8px;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 10px;color:var(--ink)">編輯資料</button></div></div><div class="cgrid"><div class="mini"><small>次數</small><b>${x.count}</b></div><div class="mini"><small>平均</small><b>${money(x.total/(x.count||1))}</b></div><div class="mini"><small>最近</small><b>${x.last||'—'}</b></div></div></div>`}).join('')||'<div class="card">沒有符合條件的客戶</div>';document.querySelectorAll('.customer').forEach(e=>e.onclick=()=>{selected=e.dataset.id;show('profile')})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTrips(){const m={};purchases.forEach(p=>{const n=p.trips?.name||'未指定';m[n]=(m[n]||0)+Number(p.amount||0)});$('tripsList').innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><div><b>${x[0]}</b></div><b>${money(x[1])}</b></div>`).join('')||'<div class="card">尚無場次</div>'}
function renderRecords(){const q=($('recordSearch').value||'').toLowerCase();$('recordsList').innerHTML=purchases.filter(p=>(p.customers?.name+' '+p.trips?.name+' '+(p.product||'')).toLowerCase().includes(q)).map(p=>`<div class="row"><div style="flex:1;min-width:0"><b>${p.customers?.name||''}</b><div class="muted">${p.purchase_date} · ${p.trips?.name||''} · 🌏 ${countryOf(p)} · ${p.category||''} · ${p.product||''}</div><div class="muted">${p.note||''}</div></div><div style="display:flex;align-items:center;gap:10px;margin-left:10px"><b>${money(p.amount)}</b><button type="button" onclick="openEditPurchase('${p.id}')" style="border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 10px;color:var(--ink)">編輯</button></div></div>`).join('')||'<div class="row">沒有紀錄</div>'}
function fillSelects(){$('customer').innerHTML=customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');$('trip').innerHTML='<option value="">不指定</option>'+trips.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
function profile(id){const c=customers.find(x=>x.id===id);if(!c)return;const x=summary(c),cats={},tripsMap={};x.p.forEach(p=>{cats[p.category||'其他']=(cats[p.category||'其他']||0)+Number(p.amount||0);const tn=p.trips?.name||'未指定';tripsMap[tn]=(tripsMap[tn]||0)+Number(p.amount||0)});const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5),topTrip=Object.entries(tripsMap).sort((a,b)=>b[1]-a[1])[0],days=x.last?Math.floor((Date.now()-new Date(x.last))/86400000):null;const yearTotal=x.p.filter(p=>p.purchase_date?.startsWith(new Date().getFullYear()+'-')).reduce((s,p)=>s+Number(p.amount||0),0);$('profileContent').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2>${escapeHtml(c.name)}</h2><button type="button" onclick="editCustomer('${escapeHtml(c.id)}')" style="border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 10px">編輯資料</button></div><div class="muted">${level(x.total)}</div><div style="font-size:30px;font-weight:900;margin:6px 0">${money(x.total)}</div><div class="cgrid"><div class="mini"><small>今年</small><b>${money(yearTotal)}</b></div><div class="mini"><small>次數</small><b>${x.count}</b></div><div class="mini"><small>平均</small><b>${money(x.total/(x.count||1))}</b></div></div><div class="cgrid"><div class="mini"><small>偏好國家</small><b>❤️ ${preferredCountry(x.p)}</b></div><div class="mini"><small>最近消費</small><b>${x.last||'—'}</b></div><div class="mini"><small>距今</small><b>${days===null?'—':days+'天'}</b></div><div class="mini"><small>最常買</small><b>${top[0]?.[0]||'—'}</b></div></div></div><div class="card"><h3>👤 客戶聯絡資料</h3><div class="row"><span>電話</span><b>${escapeHtml((lineMembers.find(m=>String(m.customer_id)===String(c.id))||{}).phone||'未填寫')}</b></div><div class="row"><span>LINE 名稱</span><b>${escapeHtml((lineMembers.find(m=>String(m.customer_id)===String(c.id))||{}).display_name||'未填寫')}</b></div><div class="row"><span>地址</span><b>${escapeHtml(c.address||'未填寫')}</b></div></div><div class="card"><h3>🌏 國家偏好</h3>${countryStatsFor(x.p).map(a=>`<div class="row"><span>${a[0]}</span><b>${money(a[1])}</b></div>`).join('')||'<div class="row">尚無消費資料</div>'}</div><div class="card"><h3>❤️ 消費偏好</h3>${top.map(a=>`<div class="row"><span>${a[0]}</span><b>${money(a[1])}</b></div>`).join('')||'<div class="row">尚無消費資料</div>'}</div><div class="card"><h3>✈️ 常購場次</h3><div class="row"><span>${topTrip?.[0]||'—'}</span><b>${topTrip?money(topTrip[1]):'$0'}</b></div></div><div class="card"><h3>🧾 最近消費</h3>${x.p.slice(0,10).map(p=>`<div class="row"><div>${p.purchase_date}<div class="muted">${p.trips?.name||''} · ${p.category||''} · ${p.product||''}</div></div><b>${money(p.amount)}</b></div>`).join('')||'<div class="row">尚無紀錄</div>'}</div>`}
function csv(){const rows=[['日期','客戶','場次','金額','類別','商品','備註'],...purchases.map(p=>[p.purchase_date,p.customers?.name,p.trips?.name,p.amount,p.category,p.product,p.note])];const s='﻿'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='NAVO消費紀錄.csv';a.click()}
function bind(){document.getElementById('loginBtn').onclick=login;document.getElementById('logoutBtn').onclick=logout;document.getElementById('goAdd').onclick=startNewPurchase;document.getElementById('goCustomers').onclick=()=>show('customers');document.getElementById('newCustomerBtn').onclick=newCustomer;document.getElementById('newTripBtn').onclick=newTrip;document.getElementById('savePurchase').onclick=savePurchase;document.getElementById('cancelEdit').onclick=cancelEdit;document.getElementById('trip').onchange=()=>{const t=trips.find(x=>x.id===$('trip').value);$('country').value=tripCountry(t)||''};document.getElementById('csvBtn').onclick=csv;document.getElementById('backCustomers').onclick=()=>show('customers');document.getElementById('search').oninput=renderCustomers;document.getElementById('customerDateFilter').onchange=renderCustomers;document.getElementById('recordSearch').oninput=renderRecords;document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>b.dataset.v==='add'?startNewPurchase():show(b.dataset.v));}
async function start(){bind();try{if(accessToken&&uid){await load();show('home')}else show('login')}catch(e){localStorage.removeItem('nvo_access_token');localStorage.removeItem('nvo_uid');accessToken='';uid='';msg('authMsg','雲端連線需要重新登入。')} }
document.addEventListener('DOMContentLoaded',start);
</script></body></html>
